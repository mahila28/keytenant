[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mahila28-keytenant"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告多租户的密钥隔离相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mahila28" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mahila28.github.io"
Repository = "https://github.com/mahila28/keytenant"
Issues = "https://github.com/mahila28/keytenant/issues"

[project.scripts]
keytenant = "keytenant:main"

[tool.setuptools]
py-modules = ["keytenant"]
